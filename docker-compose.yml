services:

  postgres:
    image: postgres:16-alpine
    container_name: erestaurante-postgres
    environment:
      POSTGRES_DB: erestaurante
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erestaurante"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - erestaurante-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: erestaurante-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: erestaurante
      DB_USER: postgres
      DB_PASSWORD: postgres
      JAVA_OPTS: >-
        -Xms256m
        -Xmx512m
        -XX:+UseZGC
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erestaurante-net
    restart: on-failure

volumes:
  postgres-data:
    driver: local

networks:
  erestaurante-net:
    driver: bridge
